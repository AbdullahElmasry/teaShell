name: teaShell CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Build teaShell
        run: make clean && make CC=clang

      - name: Make behavioral test script executable
        run: chmod +x ./_scripts/test_behavior.sh

      - name: Run behavioral tests
        run: make test
