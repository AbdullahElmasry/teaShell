name: teaShell CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build teaShell
        run: make

      - name: Make behavioral test script executable
        run: chmod +x ./.github/workflows/test_behavior.sh

      - name: Run behavioral tests
        run: make test
